name: Build EXATAS Cardputer ADV

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio==6.1.18
      - name: Build firmware
        run: pio run -e cardputer_adv
      - name: Copy firmware
        run: cp .pio/build/cardputer_adv/firmware.bin exatas-cardputer-adv.bin
      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: exatas-cardputer-adv
          path: exatas-cardputer-adv.bin
          
