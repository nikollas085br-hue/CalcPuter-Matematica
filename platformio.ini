[platformio]
default_envs = cardputer_adv

[env:cardputer_adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
board_build.filesystem = littlefs
build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -DEXATAS_CARDPUTER_ADV=1
    -std=gnu++17
lib_deps =
    https://github.com/m5stack/M5Cardputer.git#1.2.0
    https://github.com/m5stack/M5Unified.git#0.2.25
    https://github.com/m5stack/M5GFX.git#0.2.31
lib_ldf_mode = deep+
lib_compat_mode = strict

[env:native]
platform = native
build_flags = -std=c++17
