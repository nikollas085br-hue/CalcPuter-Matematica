name: Build CalcPuter Math
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install platformio
      - run: pio run -e m5stack-cardputer-adv
      - uses: actions/upload-artifact@v4
        with:
          name: CalcPuter-Matematica-firmware
          path: |
            .pio/build/m5stack-cardputer-adv/firmware.bin
            .pio/build/m5stack-cardputer-adv/firmware.elf
